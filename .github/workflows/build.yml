name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: "./FinEx -Financial Assistant/package-lock.json"
      
      - name: Install dependencies
        run: npm ci
        working-directory: "./FinEx -Financial Assistant"
      
      - name: Build project
        run: npm run build
        working-directory: "./FinEx -Financial Assistant"
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ matrix.node-version }}
          path: "./FinEx -Financial Assistant/dist"
          retention-days: 5
      
      - name: Check build size
        run: |
          du -sh "./FinEx -Financial Assistant/dist"
